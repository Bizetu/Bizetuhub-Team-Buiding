name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/bizetuh1/bizetuhub/Team_Building

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, mysql, zip, bcmath, intl

      - run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git*' --exclude='.github' --exclude='.agents' --exclude='.codex' \
            --exclude='node_modules' --exclude='tests' \
            --exclude='.env' --exclude='/storage/' --exclude='/bootstrap/cache/*.php' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/

      - name: Post-deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd $DEPLOY_PATH
            test -f .env || { echo 'Missing .env in $DEPLOY_PATH'; exit 1; }
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app/public/uploads bootstrap/cache
            rm -f bootstrap/cache/*.php
            chmod -R ug+rwx storage bootstrap/cache
            if [ -e public/storage ] && [ ! -L public/storage ]; then
              echo 'public/storage exists and is not a symlink; resolve it before deployment.'
              exit 1
            fi
            php artisan config:clear
            php artisan migrate --force
            php artisan storage:link --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          "
          