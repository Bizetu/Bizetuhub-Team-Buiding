name: Deploy vendor (manual)

on:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Zip vendor
        run: |
          mkdir vendor-upload
          zip -rq vendor-upload/vendor.zip vendor

      - name: Upload vendor.zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./vendor-upload/
          server-dir: ./
          state-name: .ftp-deploy-vendor-state.json
          timeout: 180000
          